<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Advisor — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--gold), #a07830);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .login-card h1 {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .login-card h1 span {
            color: var(--gold);
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-form input[type="password"] {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-form input[type="password"]:focus {
            border-color: var(--accent);
        }

        .login-form button {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-form button:hover {
            background: var(--accent-hover);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            display: none;
        }

        .login-error.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="login-icon">&#9992;</div>
            <h1>Aviation <span>Advisor</span></h1>
            <p class="login-subtitle">Private aviation intelligence platform</p>

            <div id="error" class="login-error">Invalid password. Please try again.</div>

            <form class="login-form" method="POST" action="/login">
                <input type="password" name="password" id="password" placeholder="Enter password" value="h3isHgNfyB-Xpt0eb9D25PwiRl8cTdfq" autofocus>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <script>
    // Show error if redirected with ?error
    if (window.location.search.includes('error=1')) {
        document.getElementById('error').classList.add('visible');
    }
    </script>
</body>
</html>
